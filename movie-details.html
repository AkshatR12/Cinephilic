<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details - Cinephilic</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/details.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        <span class="logo-brand">CINEPHILIC</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="theatres.html">Theatres</a>
        <a href="profile.html">My Bookings</a>
      </nav>
      <div class="nav-actions">
        <a href="auth.html?mode=login" class="btn btn-secondary">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Hero Details Section -->
    <section class="details-hero" id="details-hero">
      <div class="details-hero-overlay"></div>
      <div class="details-layout" id="details-layout">
        <!-- Rendered dynamically by js/details.js -->
      </div>
    </section>

    <!-- Top Cast Section -->
    <section class="section">
      <h2 class="section-title" style="margin-bottom: 15px;">Starring Cast</h2>
      <div class="cast-grid" id="cast-grid"></div>
    </section>
  </main>

  <!-- Trailer Overlay Modal -->
  <div class="modal-overlay" id="trailer-modal">
    <div class="modal-container">
      <span class="modal-close" id="close-modal-btn">&times;</span>
      <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
        <iframe id="trailer-iframe" style="position: absolute; top:0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Cinephilic Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
