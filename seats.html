<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Seats - Cinephilic</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/booking.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        <span class="logo-brand">CINEPHILIC</span>
      </a>
      <div id="seats-movie-info"></div>
    </div>
  </header>

  <main class="container" style="padding-top: 30px;">
    <!-- Seat Status Legend -->
    <div class="seat-legend">
      <div class="legend-item"><div class="seat"></div> Available</div>
      <div class="legend-item"><div class="seat selected"></div> Selected</div>
      <div class="legend-item"><div class="seat occupied"></div> Reserved</div>
    </div>

    <!-- Curved Screen -->
    <div class="screen-wrapper">
      <div class="screen"></div>
      <div class="screen-text">SCREEN THIS WAY</div>
    </div>

    <!-- Seating Grid -->
    <div class="seats-container" id="seats-container"></div>
  </main>

  <!-- Sticky Booking Bar -->
  <div class="booking-bar">
    <div class="container booking-bar-inner">
      <div>
        <div style="font-size: 0.82rem; color: var(--text-muted);">Seats: <span id="selected-seats-list" style="color: #fff; font-weight: 600;">None</span></div>
        <div class="booking-price"><span id="selected-count">0</span> Ticket(s) • <span id="total-price">₹0</span></div>
      </div>
      <button id="proceed-checkout-btn" class="btn btn-primary" disabled style="opacity: 0.5;">Proceed to Pay →</button>
    </div>
  </div>

  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/seats.js"></script>
</body>
</html>
