<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search & Discover Movies - Cinephilic</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/movies.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        <span class="logo-brand">CINEPHILIC</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="movies.html" class="active">Movies</a>
        <a href="theatres.html">Theatres</a>
        <a href="profile.html">My Bookings</a>
      </nav>
      <div class="nav-actions">
        <a href="auth.html?mode=login" class="btn btn-secondary">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="movies-header">
      <h1>Explore Movies Catalog</h1>
      <p>Search blockbusters, filter by genre or language, and grab your tickets</p>
    </div>

    <!-- Filter Control Bar -->
    <div class="filter-bar">
      <div class="search-box-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search by title, director, or keyword...">
      </div>
      <select id="genre-filter" class="filter-select">
        <option value="all">All Genres</option>
        <option value="Action">Action</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Drama">Drama</option>
        <option value="Comedy">Comedy</option>
        <option value="Animation">Animation</option>
      </select>
      <select id="language-filter" class="filter-select">
        <option value="all">All Languages</option>
        <option value="EN">English</option>
        <option value="HI">Hindi</option>
      </select>
      <select id="sort-filter" class="filter-select">
        <option value="rating-desc">Sort by Rating</option>
        <option value="title-asc">Sort by Title</option>
        <option value="price-asc">Sort by Price</option>
      </select>
    </div>

    <!-- Movies Catalog Grid -->
    <div class="movie-grid" id="movies-catalog-grid"></div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display: none;">
      <div class="empty-icon">🎬</div>
      <h3>No movies found</h3>
      <p>Try searching for a different keyword or resetting your filters.</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Cinephilic Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/movies.js"></script>
</body>
</html>
