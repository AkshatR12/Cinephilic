<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & Bookings - Cinephilic</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        <span class="logo-brand">CINEPHILIC</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="theatres.html">Theatres</a>
        <a href="profile.html" class="active">My Bookings</a>
      </nav>
      <div class="nav-actions">
        <button onclick="logoutUser()" class="btn btn-outline">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Profile Header Card -->
    <div class="profile-header">
      <div class="profile-avatar" id="user-avatar">👤</div>
      <div class="profile-info">
        <h2 id="user-name">Guest User</h2>
        <p id="user-email">guest@cinephilic.com</p>
        <span class="badge badge-gold" style="margin-top: 8px;">Cinephilic Member</span>
      </div>
    </div>

    <!-- Booking History Section -->
    <div style="margin-bottom: 50px;">
      <h2 class="section-title" style="margin-bottom: 20px;">My Ticket History</h2>
      <div class="booking-history-list" id="bookings-history-list"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Cinephilic Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/tmdb.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
