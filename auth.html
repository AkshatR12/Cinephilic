<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register - Cinephilic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page-body">

  <div class="auth-bg-light"></div>

  <div class="auth-container">
    <!-- Brand Logo Header -->
    <div class="auth-header-brand">
      <a href="index.html" class="auth-brand-logo">
        <svg class="auth-logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        <span>CINEPHILIC</span>
      </a>
      <div>
        <span class="auth-sub-badge">MySQL & OAuth 2.0 Backend Authentication</span>
      </div>
    </div>

    <!-- Glassmorphic Auth Card -->
    <div class="auth-card">
      <!-- Mode Tabs (Sign In / Register) -->
      <div class="auth-tabs-row">
        <button type="button" id="tab-login" class="auth-tab-btn active">Sign In</button>
        <button type="button" id="tab-register" class="auth-tab-btn">Register</button>
      </div>

      <h2 id="form-title" class="auth-form-title">Welcome Back</h2>

      <form id="auth-form">
        <div class="auth-form-group" id="name-group" style="display: none;">
          <label for="name-input">Full Name</label>
          <input type="text" id="name-input" class="auth-form-input" placeholder="Enter your full name">
        </div>

        <div class="auth-form-group">
          <label for="email-input">Email Address</label>
          <input type="email" id="email-input" class="auth-form-input" placeholder="user@example.com" required>
        </div>

        <div class="auth-form-group">
          <label for="password-input">Password</label>
          <input type="password" id="password-input" class="auth-form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="form-submit-btn" class="auth-submit-btn">
          Sign In
        </button>
      </form>

      <!-- OR Divider Line -->
      <div class="auth-divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <!-- Google Authentication Button -->
      <button type="button" class="google-auth-btn" onclick="handleGoogleSignIn()">
        <svg class="google-icon-svg" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
    </div>

    <!-- Bottom Nav Links -->
    <div class="auth-footer-links">
      <a href="index.html">← Back to Homepage</a>
      <a href="info.html">Help & FAQs</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
